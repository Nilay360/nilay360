// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

def localBuildRoot = new File(
    System.getenv("LOCALAPPDATA") ?: rootProject.rootDir.absolutePath,
    "Nilay360/android-build"
)

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Keep build intermediates outside OneDrive to avoid Windows sync/indexer
    // lock contention during Gradle delete/merge phases.
    buildDir = new File(localBuildRoot, project.name).absolutePath
}

task clean(type: Delete) {
    delete localBuildRoot
}
