# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM memory tuned for 8GB-class machines to reduce native OOM crashes.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError

# Build caching — reuse outputs of previous builds
org.gradle.caching=true

# Limit workers to reduce peak memory during Android builds.
org.gradle.workers.max=2

# Parallel execution can increase peak memory usage; keep off for stability.
org.gradle.parallel=false

# Windows + OneDrive can keep transient handles on build intermediates.
# Disabling file-system watching and daemon reuse improves reliability.
org.gradle.vfs.watch=false
org.gradle.daemon=false

# AndroidX is required — do not remove
android.useAndroidX=true

# Jetifier not needed — all dependencies are native AndroidX
android.enableJetifier=false
